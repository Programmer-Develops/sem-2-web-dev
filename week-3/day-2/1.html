<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create elements with JS</title>
</head>
<body>
    <!-- <div class = "cont">Hello world</div> -->
</body>
</html>
<script>
    const e = document.createElement("div")
    console.log(e)
    e.innerText = "Hello world"
    e.setAttribute("class", "cont")
    e.style.color = "blue"
    e.style.fontSize = "100px"
    document.querySelector("body").append(e)
</script>
