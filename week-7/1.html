<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Products</title>

    <style>
        #root {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        img {
            width: 100%;
            height: 400px;
        }

        #root>div {
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
        }

        #root>div:hover {
            cursor: pointer;

        }

        button {
            padding: 10px 15px;
            margin: 5px;
            background-color: yellow;
            border: none;
            border-radius: 10px;

        }

        button:hover {
            background-color: orange;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Products from API</h2>

    <div id="root">
        <!-- All product/card come/append here -->
    </div>
</body>

</html>

<script>
    //Step -1 Get the Data

    const api = "https://fakestoreapi.com/products";

    // const data = fetch(api)
    //     .then((res) => res.json())
    //     .then((data) => console.log(data)
    //     )
    // console.log(data);

    fetch(api) // fetch() is used to make a network request to the specified URL (api) and returns a promise that resolves to the response of that request
        .then((res) => res.json()) // 1st then() is used to convert the response into json format
        .then((data) => { // 2nd then() is used to get the data in json format and we can use that data for further processing
            console.log(data) // [{},{}]
            displayCart(data);
        }).catch((err) => console.log(err)) // catch() is used to handle any error that may occur during the fetch operation
        .finally(() => console.log("data fetch successfully")) // finally() is used to execute a block of code regardless of the outcome of the fetch operation (whether it was successful or resulted in an error)


    //   Step - 2 display Product on Page 
    function displayCart(arr) {
        arr.forEach((el) => { // el = {} => el.title, el.price, el.description, el.category, el.image, el.rating.rate
            console.log(el);

            // const el = {
            //     "id": 2,
            //     "title": "Mens Casual Premium Slim Fit T-Shirts ",
            //     "price": 22.3,
            //     "description": "Slim-fitting style, contrast raglan long sleeve, three-button henley placket, light weight & soft fabric for breathable and comfortable wearing. And Solid stitched shirts with round neck made for durability and a great fit for casual fashion wear and diehard baseball fans. The Henley style round neckline includes a three-button placket.",
            //     "category": "men's clothing",
            //     "image": "https://fakestoreapi.com/img/71-3HjGNDUL._AC_SY879._SX._UX._SY._UY_t.png",
            //     "rating": {
            //         "rate": 4.1,
            //         "count": 259
            //     }
            // }

            // Step - 3 Create Card for each Product and append to the root div
            const box = document.createElement("div");

            const image = document.createElement("img");
            image.setAttribute("src", el.image);

            const title = document.createElement("h3");
            title.innerText = `Title: ${el.title}`;

            const category = document.createElement("h4");
            category.innerText = `Category: ${el.category}`;

            const description = document.createElement("p");
            description.innerText = `Description: ${el.description}`;

            const price = document.createElement("button");
            price.innerText = `Price: $${el.price}`;

            const rating = document.createElement("button");
            rating.innerText = `Rating: ${el.rating.rate}`;

            box.append(image, title, category, description, price, rating);
            document.querySelector("#root").append(box)

        })

    }

</script>

<!-- Learning Outcomes: -->
<!-- 1. Understanding how to fetch data from an API using fetch() -->
<!-- 2. Understanding how to convert the response into JSON format using .json() -->
<!-- 3. Understanding how to handle errors using .catch() -->
<!-- 4. Understanding how to execute code regardless of success or failure using .finally() -->
<!-- 5. Understanding how to dynamically create and append HTML elements to the DOM -->
